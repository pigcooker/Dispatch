<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Dispatch — Your Homepage</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1e26;
    --panel-raised: #20252f;
    --line: #2a2f3a;
    --text: #e8e6df;
    --muted: #8b91a0;
    --faint: #565d6d;
    --accent: #e0a458;
    --cred-high: #6fae8f;
    --cred-mixed: #d4a04a;
    --cred-low: #c1665a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  ::selection { background: var(--accent); color: #12151a; }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  }

  /* ---- Header ---- */
  header {
    padding: 22px 28px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0;
    font-weight: 800;
  }
  h1 span { color: var(--accent); }
  #status-line {
    font-size: 12px;
    color: var(--faint);
  }
  #status-line b { color: var(--muted); font-weight: 600; }

  /* ---- Shuffle toggle ---- */
  #shuffle-ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .switch {
    position: relative;
    width: 38px;
    height: 20px;
    flex: none;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: var(--line);
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .switch-track::before {
    content: '';
    position: absolute;
    height: 14px; width: 14px;
    left: 3px; bottom: 3px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform 0.15s, background 0.15s;
  }
  .switch input:checked + .switch-track { background: rgba(224,164,88,0.25); }
  .switch input:checked + .switch-track::before { transform: translateX(18px); background: var(--accent); }

  /* ---- Layout ---- */
  #layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    align-items: start;
  }
  @media (max-width: 860px) {
    #layout { grid-template-columns: 1fr; }
    #sidebar { position: static !important; border-right: none !important; border-bottom: 1px solid var(--line); }
  }

  /* ---- Sidebar ---- */
  #sidebar {
    border-right: 1px solid var(--line);
    padding: 18px 16px 40px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .side-heading {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 18px 0 8px;
    font-weight: 700;
  }
  .side-heading:first-child { margin-top: 0; }
  .cat-btn {
    display: flex;
    justify-content: space-between;
    width: 100%;
    background: none;
    border: none;
    color: var(--muted);
    text-align: left;
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .cat-btn:hover { background: var(--panel); color: var(--text); }
  .cat-btn.active { background: var(--panel-raised); color: var(--accent); font-weight: 700; }
  .cat-btn .count { color: var(--faint); font-size: 11.5px; }
  .cat-btn.active .count { color: var(--accent); opacity: 0.7; }

  .cat-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cat-row.dragging { opacity: 0.4; }
  .cat-row.drag-over { border-top: 2px solid var(--accent); }
  .drag-handle {
    flex: none;
    width: 14px;
    text-align: center;
    color: var(--faint);
    cursor: grab;
    font-size: 12px;
    user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .cat-row .cat-btn { flex: 1; }

  .source-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 5px;
    font-size: 12.5px;
  }
  .source-row:hover { background: var(--panel); }
  .source-row input { accent-color: var(--accent); cursor: pointer; }
  .source-row label { flex: 1; cursor: pointer; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cred-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .cred-high { background: var(--cred-high); }
  .cred-mixed { background: var(--cred-mixed); }
  .cred-low { background: var(--cred-low); }

  #legend {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--faint);
  }
  #legend div { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }

  /* ---- Feed ---- */
  #feed {
    padding: 22px 28px 60px;
  }
  .cat-block { margin-bottom: 34px; }
  .cat-block-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    display: inline-block;
    padding-bottom: 4px;
    margin-bottom: 14px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, transform 0.1s;
    animation: card-in 0.25s ease-out;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:hover { }

  #load-progress {
    height: 2px;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease-out;
    position: fixed;
    top: 0; left: 0;
    z-index: 10;
  }
  .card-media {
    flex: none;
    width: 150px;
    min-height: 100px;
    background: var(--panel-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-media img.thumb {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .card-media img.logo {
    width: 40px; height: 40px;
    object-fit: contain;
    opacity: 0.85;
  }
  .card-body {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    color: var(--faint);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .card-meta .src { color: var(--accent); font-weight: 700; }
  .card-title {
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    line-height: 1.35;
    font-weight: 700;
    display: block;
  }
  .card:hover .card-title { color: var(--accent); }
  .card-snippet {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-time { font-size: 11px; color: var(--faint); margin-top: auto; }

  .card.is-read { opacity: 0.5; }
  .card.is-read .card-title { color: var(--muted); font-weight: 600; }

  @media (max-width: 560px) {
    .card { flex-direction: column; }
    .card-media { width: 100%; height: 120px; }
  }

  .empty-msg, .loading-msg {
    color: var(--faint);
    font-size: 13px;
    padding: 10px 0;
  }
  .err-msg { color: var(--cred-low); font-size: 12px; }

  /* ---- Top widgets row: weather + radar + Cubs ---- */
  #widgets-row {
    display: grid;
    grid-template-columns: 220px 180px 1fr;
    gap: 12px;
    padding: 16px 28px 0;
  }
  @media (max-width: 820px) {
    #widgets-row { grid-template-columns: 1fr 1fr; }
    #widgets-row .widget-box:last-child { grid-column: 1 / -1; }
  }
  @media (max-width: 520px) {
    #widgets-row { grid-template-columns: 1fr; }
    #widgets-row .widget-box:last-child { grid-column: auto; }
  }
  .widget-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .widget-title {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .widget-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .widget-title-row .widget-title { margin-bottom: 0; }
  #surf-spot-select {
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 11.5px;
    padding: 3px 6px;
    font-family: inherit;
    cursor: pointer;
  }

  #radar-box { padding: 12px; display: flex; flex-direction: column; cursor: pointer; }
  #radar-frame {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 6px;
    display: block;
    pointer-events: none; /* clicks go to the box, which opens the modal */
  }

  #radar-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,12,16,0.85);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  #radar-modal.open { display: flex; }
  #radar-modal-inner {
    position: relative;
    width: min(90vw, 900px);
    height: min(85vh, 700px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  #radar-modal-frame { width: 100%; height: 100%; border: none; }
  #radar-modal-close {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    width: 28px; height: 28px;
    cursor: pointer;
    z-index: 2;
    font-size: 13px;
  }

  #surf-row { padding: 12px 28px 0; }
  #surf-box { padding: 12px 16px 16px; }
  #surf-body { display: flex; gap: 28px; flex-wrap: wrap; }
  .surf-stat { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .surf-stat b { color: var(--text); display: block; font-size: 16px; font-weight: 800; }

  #surf-forecast {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    overflow-x: auto;
  }
  .forecast-day {
    flex: none;
    min-width: 92px;
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
  }
  .forecast-day .fd-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--faint);
    margin-bottom: 4px;
  }
  .forecast-day .fd-swell {
    font-size: 14px;
    font-weight: 800;
    color: var(--accent);
  }
  .forecast-day .fd-wind { margin-top: 2px; }

  /* Weather */
  #weather-body { display: flex; flex-direction: column; gap: 8px; }
  #weather-current { display: flex; align-items: center; gap: 10px; }
  #weather-icon { font-size: 28px; line-height: 1; }
  #weather-temp { font-size: 24px; font-weight: 800; color: var(--text); }
  #weather-details { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  #weather-details b { color: var(--text); }

  #weather-forecast {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .wx-day {
    flex: 1;
    text-align: center;
    font-size: 10px;
    color: var(--muted);
  }
  .wx-day-label {
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--faint);
    font-size: 9.5px;
    margin-bottom: 2px;
  }
  .wx-day-icon { font-size: 15px; line-height: 1.2; }
  .wx-day-hilo { font-size: 10px; margin-top: 2px; }
  .wx-day-hilo b { color: var(--text); font-weight: 700; }

  #weather-alerts { display: flex; flex-direction: column; gap: 4px; }
  .wx-alert {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 10.5px;
    line-height: 1.35;
    cursor: pointer;
  }
  .wx-alert-icon { font-size: 12px; line-height: 1.3; }
  .wx-alert-event { color: inherit; font-weight: 700; }
  .wx-alert-expires { color: inherit; opacity: 0.75; font-weight: 400; }
  .wx-alert-desc {
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--muted);
    padding: 0 8px 4px 8px;
    display: none;
    white-space: pre-line;
  }
  .wx-alert.expanded + .wx-alert-desc { display: block; }
  .wx-alert.sev-extreme, .wx-alert.sev-severe {
    background: rgba(193, 102, 90, 0.16);
    color: var(--cred-low);
    border: 1px solid rgba(193, 102, 90, 0.35);
  }
  .wx-alert.sev-moderate {
    background: rgba(212, 160, 74, 0.14);
    color: var(--cred-mixed);
    border: 1px solid rgba(212, 160, 74, 0.3);
  }
  .wx-alert.sev-minor, .wx-alert.sev-unknown {
    background: var(--panel-raised);
    color: var(--muted);
    border: 1px solid var(--line);
  }

  /* Cubs */
  .cat-pinned-widget { margin-bottom: 16px; }
  #cubs-body { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .cubs-game { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .cubs-game b { color: var(--text); }
  .cubs-score { font-size: 15px; font-weight: 800; color: var(--accent); }
  #cubs-standings {
    font-size: 12px;
    border-collapse: collapse;
  }
  #cubs-standings th {
    text-align: left;
    color: var(--faint);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 2px 10px 4px 0;
  }
  #cubs-standings td { padding: 2px 10px 2px 0; color: var(--muted); }
  #cubs-standings tr.is-cubs td { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<div id="load-progress"></div>

<header>
  <h1>Dispatch<span>.</span></h1>
  <div id="shuffle-ctrl">
    <span id="shuffle-label">Most recent by category</span>
    <label class="switch">
      <input type="checkbox" id="shuffle-toggle">
      <span class="switch-track"></span>
    </label>
  </div>
  <div id="status-line">Loading feeds… <b id="status-count"></b></div>
</header>

<div id="widgets-row">
  <div class="widget-box">
    <div class="widget-title">Weather · 90032</div>
    <div id="weather-body">Loading…</div>
  </div>
  <div class="widget-box" id="radar-box" title="Click to expand">
    <div class="widget-title">Radar</div>
    <iframe id="radar-frame" src="https://embed.windy.com/embed2.html?lat=34.087&lon=-118.194&detailLat=34.087&detailLon=-118.194&width=220&height=220&zoom=7&level=surface&overlay=radar&menu=&message=false&marker=false&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=default&radarRange=-1"
      frameborder="0" loading="lazy"></iframe>
  </div>
  <div class="widget-box" id="surf-box">
    <div class="widget-title-row">
      <div class="widget-title">Surf Report</div>
      <select id="surf-spot-select"></select>
    </div>
    <div id="surf-body">Loading…</div>
    <div id="surf-forecast"></div>
  </div>
</div>


<div id="radar-modal">
  <div id="radar-modal-inner">
    <button id="radar-modal-close">✕</button>
    <iframe id="radar-modal-frame" frameborder="0"></iframe>
  </div>
</div>

<div id="layout">
  <aside id="sidebar">
    <div class="side-heading">Categories</div>
    <div id="cat-list"></div>

    <div class="side-heading">Sources</div>
    <div id="source-list"></div>

    <div id="legend">
      <div><span class="cred-dot cred-high"></span> Generally high credibility</div>
      <div><span class="cred-dot cred-mixed"></span> Mixed / lean bias</div>
      <div><span class="cred-dot cred-low"></span> Tabloid / low credibility</div>
    </div>
  </aside>

  <main id="feed">
    <div class="loading-msg">Fetching live headlines…</div>
  </main>
</div>

// cred: 'high' | 'mixed' | 'low'  (rough, editorial judgment — not gospel)
// ---------------------------------------------------------------
// logo: shown as a fallback when an article has no thumbnail image (favicon service, no key needed)

  return `https://www.google.com/s2/favicons?sz=128&domain=${domain}`;
}

  { id: 'bbc-world',   name: 'BBC World',        cat: 'World',         cred: 'high',  url: 'http://feeds.bbci.co.uk/news/world/rss.xml', logo: logoFor('bbc.com') },

  { id: 'techcrunch',   name: 'TechCrunch',      cat: 'Tech',          cred: 'mixed', url: 'https://techcrunch.com/feed/', logo: logoFor('techcrunch.com') },
  { id: 'wired',        name: 'Wired',           cat: 'Tech',          cred: 'high',  url: 'https://www.wired.com/feed/rss', logo: logoFor('wired.com') },

  { id: 'sciencedaily', name: 'Science Daily',   cat: 'Science',       cred: 'high',  url: 'https://www.sciencedaily.com/rss/all.xml', logo: logoFor('sciencedaily.com') },

  { id: 'variety',      name: 'Variety',         cat: 'Entertainment', cred: 'high',  url: 'https://variety.com/feed/', logo: logoFor('variety.com') },

  { id: 'cubs-mlb',     name: 'Cubs (MLB.com)',  cat: 'Cubs',          cred: 'high',  url: 'https://www.mlb.com/cubs/feeds/news/rss.xml', logo: logoFor('mlb.com') },
  { id: 'cubs-insider',   name: 'Cubs Insider',    cat: 'Cubs',          cred: 'mixed', url: 'https://cubsinsider.com/feed/', logo: logoFor('cubsinsider.com') },
  { id: 'cubs-bleacher', name: 'Bleacher Nation (Cubs)', cat: 'Cubs',  cred: 'mixed', url: 'https://www.bleachernation.com/cubs/feed/', logo: logoFor('bleachernation.com') },
  { id: 'cubs-northside', name: 'Northside Baseball', cat: 'Cubs',    cred: 'mixed', url: 'https://northsidebaseball.com/rss/3-north-side-baseball-content.xml/', logo: logoFor('northsidebaseball.com') },


  { id: 'laist',         name: 'LAist',          cat: 'LA Local',      cred: 'high',  url: 'https://laist.com/index.atom', logo: logoFor('laist.com') },
  { id: 'abc7-la',       name: 'ABC7 Los Angeles', cat: 'LA Local',    cred: 'high',  url: 'https://abc7.com/feed/', logo: logoFor('abc7.com') },
  { id: 'latimes-local', name: 'LA Times (Local)', cat: 'LA Local',    cred: 'high',  url: 'https://www.latimes.com/local/rss2.0.xml', logo: logoFor('latimes.com') },

let activeCat = 'All';
let feedData = {}; // sourceId -> array of items
let loadedCount = 0;

function buildSidebar() {
  const catList = document.getElementById('cat-list');
  catList.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn' + (activeCat === 'All' ? ' active' : '');
  allBtn.innerHTML = `<span>All</span><span class="count">${SOURCES.length}</span>`;
  allBtn.onclick = () => { activeCat = 'All'; buildSidebar(); renderFeed(); };
  catList.appendChild(allBtn);

  let dragSrcIdx = null;

  catOrder.forEach((cat, idx) => {
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.draggable = true;
    row.dataset.idx = idx;

    const handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.textContent = '⠿';
    row.appendChild(handle);

    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === activeCat ? ' active' : '');
    const n = SOURCES.filter(s => s.cat === cat).length;
    btn.innerHTML = `<span>${cat}</span><span class="count">${n}</span>`;
    btn.onclick = () => { activeCat = cat; buildSidebar(); renderFeed(); };
    row.appendChild(btn);

    row.addEventListener('dragstart', (e) => {
      dragSrcIdx = idx;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      document.querySelectorAll('.cat-row').forEach(r => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const targetIdx = idx;
      if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
      const moved = catOrder.splice(dragSrcIdx, 1)[0];
      catOrder.splice(targetIdx, 0, moved);
      persistCatOrder();
      buildSidebar();
      renderFeed();
    });

    catList.appendChild(row);
  });

  const srcList = document.getElementById('source-list');
  srcList.innerHTML = '';
  SOURCES.forEach(s => {
    const row = document.createElement('div');
    row.className = 'source-row';
    row.innerHTML = `
      <input type="checkbox" id="chk-${s.id}" ${disabled.has(s.id) ? '' : 'checked'}>
      <span class="cred-dot cred-${s.cred}"></span>
      <label for="chk-${s.id}" title="${s.name}">${s.name}</label>
    `;
    row.querySelector('input').onchange = (e) => {
      if (e.target.checked) disabled.delete(s.id); else disabled.add(s.id);
      persistDisabled();
      renderFeed();
    };
    srcList.appendChild(row);
  });
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return diffMin + 'm ago';
  const diffHr = Math.round(diffMin / 60);
  if (diffHr < 24) return diffHr + 'h ago';
  return Math.round(diffHr / 24) + 'd ago';
}

// Fisher–Yates shuffle
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function cardHTML(item) {
  const mediaInner = item.image
    ? `<img class="thumb" src="${item.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<img class=&quot;logo&quot; src=&quot;${item.source.logo}&quot; alt=&quot;&quot;>'">`
    : `<img class="logo" src="${item.source.logo}" alt="" loading="lazy">`;
  const snippetHTML = item.snippet ? `<div class="card-snippet">${item.snippet}</div>` : '';
  const readClass = readUrls.has(item.link) ? ' is-read' : '';
  return `
    <a class="card${readClass}" href="${item.link}" target="_blank" rel="noopener" data-link="${item.link}">
      <div class="card-media">${mediaInner}</div>
      <div class="card-body">
        <div class="card-meta"><span class="cred-dot cred-${item.source.cred}"></span><span class="src">${item.source.name}</span></div>
        <span class="card-title">${item.title}</span>
        ${snippetHTML}
        <div class="card-time mono">${timeAgo(item.pubDate)}</div>
      </div>
    </a>
  `;
}

function renderFeed() {
  const main = document.getElementById('feed');
  main.innerHTML = '';
  const fullyShuffle = document.getElementById('shuffle-toggle').checked;

  if (fullyShuffle) {
    // one mixed pool across all enabled sources, categories ignored
    const cats = activeCat === 'All' ? catOrder : [activeCat];
    let items = [];
    cats.forEach(cat => {
      SOURCES.filter(s => s.cat === cat && !disabled.has(s.id)).forEach(s => {
        (feedData[s.id] || []).forEach(item => items.push({ ...item, source: s }));
      });
    });
    if (items.length === 0) {
      main.innerHTML = '<div class="empty-msg">No sources enabled — toggle some on in the sidebar, or feeds are still loading.</div>';
      return;
    }
    items = shuffleArr(items).slice(0, 48);
    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'cards';
    cardsWrap.innerHTML = items.map(cardHTML).join('');
    main.appendChild(cardsWrap);
    return;
  }

  // grouped-by-category mode, shuffled within each category
  const cats = activeCat === 'All' ? catOrder : [activeCat];
  let anyContent = false;

  cats.forEach(cat => {
    const sourcesInCat = SOURCES.filter(s => s.cat === cat && !disabled.has(s.id));
    let items = [];
    sourcesInCat.forEach(s => {
      (feedData[s.id] || []).forEach(item => items.push({ ...item, source: s }));
    });
    if (sourcesInCat.length === 0) return;
    items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    items = items.slice(0, 12);

    const block = document.createElement('div');
    block.className = 'cat-block';
    const title = document.createElement('div');
    title.className = 'cat-block-title';
    title.textContent = cat;
    block.appendChild(title);

    if (cat === 'Cubs') {
      const cubsWidget = document.createElement('div');
      cubsWidget.className = 'widget-box cat-pinned-widget';
      cubsWidget.innerHTML = `<div class="widget-title">Scores &amp; Standings</div><div id="cubs-body">${cubsWidgetHTML || 'Loading…'}</div>`;
      block.appendChild(cubsWidget);
    }

    if (items.length === 0) {
      const msg = document.createElement('div');
      msg.className = 'loading-msg';
      msg.textContent = 'Loading…';
      block.appendChild(msg);
    } else {
      anyContent = true;
      const cardsWrap = document.createElement('div');
      cardsWrap.className = 'cards';
      cardsWrap.innerHTML = items.map(cardHTML).join('');
      block.appendChild(cardsWrap);
    }
    main.appendChild(block);
  });

  if (!anyContent && main.children.length === 0) {
    main.innerHTML = '<div class="empty-msg">No sources enabled in this category — toggle some on in the sidebar.</div>';
  }
}

function extractImgFromHTML(html) {
  if (!html) return null;
  const matches = [...html.matchAll(/<img[^>]+src=["']([^"']+)["']/gi)];
  for (const m of matches) {
    const src = m[1];
    // skip obvious tracking pixels / spacer gifs
    if (/pixel|spacer|1x1|tracking/i.test(src)) continue;
    return src;
  }
  return null;
}

function snippetFromHTML(html, maxLen = 160) {
  if (!html) return '';
  const text = html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  if (text.length <= maxLen) return text;
  return text.slice(0, maxLen).replace(/\s+\S*$/, '') + '…';
}

document.getElementById('shuffle-toggle').addEventListener('change', (e) => {
  document.getElementById('shuffle-label').textContent = e.target.checked ? 'Fully shuffled' : 'Most recent by category';
  renderFeed();
});

let renderPending = false;
let firstPaintDone = false;

function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    setTimeout(() => {
      renderPending = false;
      renderFeed();
    }, 120); // coalesce any sources that finish within this window into one repaint
  });
}

const RSS2JSON_KEY = 'majwlasggdb0rtkcbe24by9atfeufs3yyszbrpkj';
const STALE_MS = 15 * 60 * 1000; // 15 min
function shouldBustCache() {
  let last = 0;
  try { last = parseInt(localStorage.getItem('dispatch-last-fresh-load') || '0', 10); } catch (e) {}
  const stale = (Date.now() - last) > STALE_MS;
  if (stale) {
    try { localStorage.setItem('dispatch-last-fresh-load', String(Date.now())); } catch (e) {}
  }
  return stale;
}
const BUST_CACHE = shouldBustCache();

async function loadSource(s) {
  const proxy = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(s.url) + '&api_key=' + RSS2JSON_KEY + (BUST_CACHE ? '&_=' + Date.now() : '');
  try {
    const res = await fetch(proxy, BUST_CACHE ? { cache: 'no-store' } : {});
    const json = await res.json();
    if (json.status === 'ok' && json.items) {
      feedData[s.id] = json.items.map(it => {
        let title = it.title;
        let snippet = snippetFromHTML(it.description) || snippetFromHTML(it.content);
        // Kottke's feed cuts headline-less link posts off with "..."; use the full post text instead
        if (s.id === 'kottke' && /(\.\.\.|\u2026)\s*$/.test(title || '')) {
          const full = snippetFromHTML(it.content || it.description, 2000);
          if (full) { title = full; snippet = ''; }
        }
        return {
          title,
          link: it.link,
          pubDate: it.pubDate,
          image: it.thumbnail || it.enclosure?.link || extractImgFromHTML(it.content) || extractImgFromHTML(it.description) || null,
          snippet
        };
      });
    } else {
      feedData[s.id] = [];
    }
  } catch (e) {
    feedData[s.id] = [];
  }
  loadedCount++;
  const pct = Math.round((loadedCount / SOURCES.length) * 100);
  document.getElementById('status-count').textContent = `${loadedCount} / ${SOURCES.length} sources loaded`;
  document.getElementById('load-progress').style.width = pct + '%';
  if (loadedCount === SOURCES.length) {
    document.getElementById('status-line').firstChild.textContent = 'Updated ';
    document.getElementById('load-progress').style.opacity = '0';
  }

  // Hold the very first paint until roughly a third of sources are back (or we're done),
  // so the page doesn't visibly reshuffle every fraction of a second on open.
  if (!firstPaintDone) {
    if (loadedCount / SOURCES.length >= 0.35 || loadedCount === SOURCES.length) {
      firstPaintDone = true;
      renderFeed();
    }
    return;
  }
  scheduleRender();
}

function toggleAlert(el) {
  el.classList.toggle('expanded');
}

async function loadWeatherAlerts() {
  try {
    const res = await fetch('https://api.weather.gov/alerts/active?point=34.087,-118.194');
    const json = await res.json();
    const features = json.features || [];
    if (!features.length) return '';
    return `<div id="weather-alerts">` + features.map(f => {
      const p = f.properties;
      const sev = (p.severity || 'unknown').toLowerCase();
      const icon = ALERT_ICONS[sev] || 'ℹ️';
      const expires = p.expires ? new Date(p.expires).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '';
      const desc = (p.description || '').trim();
      return `
        <div class="wx-alert sev-${sev}" onclick="toggleAlert(this)">
          <span class="wx-alert-icon">${icon}</span>
          <span><span class="wx-alert-event">${p.event}</span>${expires ? ` <span class="wx-alert-expires">· until ${expires}</span>` : ''}</span>
        </div>
        <div class="wx-alert-desc">${desc}</div>
      `;
    }).join('') + `</div>`;
  } catch (e) {
    return '';
  }
}

async function loadWeather() {
  const el = document.getElementById('weather-body');
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=34.087&longitude=-118.194&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=6';
    const [res, alertsHTML] = await Promise.all([fetch(url), loadWeatherAlerts()]);
    const json = await res.json();
    const c = json.current;
    const d = json.daily;
    const desc = WEATHER_CODES[c.weather_code] || '—';
    const icon = WEATHER_ICONS[c.weather_code] || '🌡️';
    const todayHi = d?.temperature_2m_max?.[0];
    const todayLo = d?.temperature_2m_min?.[0];
    const todayPrecip = d?.precipitation_probability_max?.[0];

    const forecastDays = (d?.time || []).slice(1, 6); // skip today, next 5 days
    const forecastHTML = forecastDays.map((dateStr, i) => {
      const idx = i + 1;
      const hi = d.temperature_2m_max[idx];
      const lo = d.temperature_2m_min[idx];
      const dIcon = WEATHER_ICONS[d.weather_code[idx]] || '🌡️';
      const label = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
      return `
        <div class="wx-day">
          <div class="wx-day-label">${label}</div>
          <div class="wx-day-icon">${dIcon}</div>
          <div class="wx-day-hilo"><b>${Math.round(hi)}°</b> ${Math.round(lo)}°</div>
        </div>
      `;
    }).join('');

    el.innerHTML = `
      ${alertsHTML}
      <div id="weather-current">
        <div id="weather-icon">${icon}</div>
        <div id="weather-temp">${Math.round(c.temperature_2m)}°</div>
        <div id="weather-details">
          <div><b>${desc}</b></div>
          <div>${todayHi != null ? 'H:' + Math.round(todayHi) + '° L:' + Math.round(todayLo) + '°' : ''} · Feels ${Math.round(c.apparent_temperature)}°</div>
          <div>Wind ${Math.round(c.wind_speed_10m)} mph${todayPrecip != null ? ' · Precip ' + todayPrecip + '%' : ''}</div>
        </div>
      </div>
      <div id="weather-forecast">${forecastHTML}</div>
    `;
  } catch (e) {
    el.innerHTML = '<span class="err-msg">Weather unavailable</span>';
  }
}

// Cubs widget — last/next game + NL Central standings, via MLB Stats API (public, no key)
// ---------------------------------------------------------------
const CUBS_TEAM_ID = 112;
const NL_CENTRAL_DIVISION_ID = 205;

let cubsWidgetHTML = '';

async function loadCubs() {
  try {
    const today = new Date();
    const start = new Date(today); start.setDate(start.getDate() - 14);
    const end = new Date(today); end.setDate(end.getDate() + 7);
    const fmt = d => d.toISOString().slice(0, 10);

    const [scheduleRes, standingsRes] = await Promise.all([
      fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${CUBS_TEAM_ID}&startDate=${fmt(start)}&endDate=${fmt(end)}`),
      fetch(`https://statsapi.mlb.com/api/v1/standings?leagueId=104&standingsTypes=regularSeason&season=${today.getFullYear()}`)
    ]);
    const schedule = await scheduleRes.json();
    const standings = await standingsRes.json();

    // flatten all games from schedule dates
    let games = [];
    (schedule.dates || []).forEach(d => games.push(...d.games));
    games.sort((a, b) => new Date(a.gameDate) - new Date(b.gameDate));

    const now = Date.now();
    const past = games.filter(g => new Date(g.gameDate).getTime() <= now && g.status.abstractGameState === 'Final');
    const future = games.filter(g => new Date(g.gameDate).getTime() > now);
    const last = past[past.length - 1];
    const next = future[0];

    let gamesHTML = '';
    if (last) {
      const home = last.teams.home, away = last.teams.away;
      const cubsHome = home.team.id === CUBS_TEAM_ID;
      const cubsScore = cubsHome ? home.score : away.score;
      const oppScore = cubsHome ? away.score : home.score;
      const opp = cubsHome ? away.team.name : home.team.name;
      const result = cubsScore > oppScore ? 'W' : (cubsScore < oppScore ? 'L' : 'T');
      gamesHTML += `<div class="cubs-game"><b>Last game</b><br>
        <span class="cubs-score">${result} ${cubsScore}–${oppScore}</span> vs ${opp}<br>
        ${new Date(last.gameDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>`;
    }
    if (next) {
      const home = next.teams.home, away = next.teams.away;
      const cubsHome = home.team.id === CUBS_TEAM_ID;
      const opp = cubsHome ? away.team.name : home.team.name;
      gamesHTML += `<div class="cubs-game"><b>Next game</b><br>
        ${cubsHome ? 'vs' : '@'} ${opp}<br>
        ${new Date(next.gameDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</div>`;
    }

    // NL Central standings
    let standingsHTML = '';
    const division = (standings.records || []).find(r => r.division.id === NL_CENTRAL_DIVISION_ID);
    if (division) {
      const rows = division.teamRecords
        .slice()
        .sort((a, b) => a.divisionRank - b.divisionRank)
        .map(tr => {
          const isCubs = tr.team.id === CUBS_TEAM_ID;
          return `<tr class="${isCubs ? 'is-cubs' : ''}">
            <td>${tr.team.name.replace('St. Louis', 'STL').replace('Milwaukee', 'MIL').replace('Cincinnati', 'CIN').replace('Pittsburgh', 'PIT').replace('Chicago Cubs', 'CHC')}</td>
            <td>${tr.wins}-${tr.losses}</td>
            <td>${tr.divisionGamesBack === '-' ? '—' : tr.divisionGamesBack}</td>
          </tr>`;
        }).join('');
      standingsHTML = `
        <table id="cubs-standings">
          <thead><tr><th>Team</th><th>W-L</th><th>GB</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    cubsWidgetHTML = (gamesHTML + standingsHTML) || '<span class="err-msg">No Cubs data available right now</span>';
  } catch (e) {
    cubsWidgetHTML = '<span class="err-msg">Cubs data unavailable</span>';
  }
  renderFeed();
}

function initSurfDropdown() {
  const sel = document.getElementById('surf-spot-select');
  sel.innerHTML = SURF_SPOTS.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  let saved = 'el-porto';
  try { saved = localStorage.getItem('dispatch-surf-spot') || saved; } catch (e) {}
  sel.value = saved;
  sel.addEventListener('change', () => {
    try { localStorage.setItem('dispatch-surf-spot', sel.value); } catch (e) {}
    loadSurf(sel.value);
  });
  loadSurf(sel.value);
}

const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function degToCompass(deg) {
  if (deg == null) return '—';
  return COMPASS[Math.round(deg / 22.5) % 16];
}

function fmtTime(isoStr) {
  if (!isoStr) return '—';
  return new Date(isoStr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

async function loadSurf(spotId) {
  const el = document.getElementById('surf-body');
  const fcEl = document.getElementById('surf-forecast');
  const spot = SURF_SPOTS.find(s => s.id === spotId) || SURF_SPOTS[0];
  el.innerHTML = 'Loading…';
  fcEl.innerHTML = '';
  try {
    const today = new Date();
    const fmtDate = d => d.toISOString().slice(0, 10).replace(/-/g, '');
    const todayStr = fmtDate(today);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = fmtDate(tomorrow);

    const [marineRes, windRes, marineDailyRes, windDailyRes, tideRes] = await Promise.all([
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&current=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction&length_unit=imperial&timezone=America%2FLos_Angeles`),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=mph&timezone=America%2FLos_Angeles`),
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&daily=swell_wave_height_max,swell_wave_period_max,swell_wave_direction_dominant&length_unit=imperial&timezone=America%2FLos_Angeles&forecast_days=6`),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&daily=wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=6`),
      fetch(`https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=dispatch&begin_date=${todayStr}&end_date=${tomorrowStr}&datum=MLLW&station=${spot.tideStation}&time_zone=lst_ldt&units=english&interval=hilo&format=json`)
    ]);
    const marine = await marineRes.json();
    const wind = await windRes.json();
    const marineDaily = await marineDailyRes.json();
    const windDaily = await windDailyRes.json();
    const tide = await tideRes.json();
    const m = marine.current || {};
    const w = wind.current || {};

    el.innerHTML = `
      <div class="surf-stat"><b>${m.swell_wave_height != null ? m.swell_wave_height.toFixed(1) + ' ft' : '—'}</b>Swell height</div>
      <div class="surf-stat"><b>${m.swell_wave_period != null ? Math.round(m.swell_wave_period) + 's' : '—'}</b>Swell period</div>
      <div class="surf-stat"><b>${degToCompass(m.swell_wave_direction)}</b>Swell direction</div>
      <div class="surf-stat"><b>${w.wind_speed_10m != null ? Math.round(w.wind_speed_10m) + ' mph' : '—'}</b>Wind (${degToCompass(w.wind_direction_10m)})</div>
      <div class="surf-stat"><b>${w.wind_gusts_10m != null ? Math.round(w.wind_gusts_10m) + ' mph' : '—'}</b>Gusts</div>
    `;

    // Sunrise/sunset (today)
    const sunrise = windDaily.daily?.sunrise?.[0];
    const sunset = windDaily.daily?.sunset?.[0];

    // Next two tide events from now
    const nowMs = Date.now();
    const tidePredictions = (tide.predictions || [])
      .map(p => ({ ...p, ms: new Date(p.t.replace(' ', 'T')).getTime() }))
      .filter(p => p.ms >= nowMs)
      .sort((a, b) => a.ms - b.ms)
      .slice(0, 2);
    const tideHTML = tidePredictions.length
      ? tidePredictions.map(p => `<div class="surf-stat"><b>${p.type === 'H' ? 'High' : 'Low'} ${fmtTime(p.t.replace(' ', 'T'))}</b>${parseFloat(p.v).toFixed(1)} ft</div>`).join('')
      : '<div class="surf-stat"><b>—</b>Tide unavailable</div>';

    el.innerHTML += `
      <div class="surf-stat"><b>${fmtTime(sunrise)}</b>Sunrise</div>
      <div class="surf-stat"><b>${fmtTime(sunset)}</b>Sunset</div>
      ${tideHTML}
    `;

    const dailyTimes = (marineDaily.daily && marineDaily.daily.time) || [];
    fcEl.innerHTML = dailyTimes.map((dateStr, i) => {
      const swellH = marineDaily.daily.swell_wave_height_max?.[i];
      const swellP = marineDaily.daily.swell_wave_period_max?.[i];
      const swellDir = marineDaily.daily.swell_wave_direction_dominant?.[i];
      const windSpd = windDaily.daily?.wind_speed_10m_max?.[i];
      const windDir = windDaily.daily?.wind_direction_10m_dominant?.[i];
      const label = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
      return `
        <div class="forecast-day">
          <div class="fd-label">${label}</div>
          <div class="fd-swell">${swellH != null ? swellH.toFixed(1) + 'ft' : '—'}</div>
          <div>${swellP != null ? Math.round(swellP) + 's' : '—'} ${degToCompass(swellDir)}</div>
          <div class="fd-wind">${windSpd != null ? Math.round(windSpd) + 'mph' : '—'} ${degToCompass(windDir)}</div>
        </div>
      `;
    }).join('');
  } catch (e) {
    el.innerHTML = '<span class="err-msg">Wind/swell data unavailable</span>';
  }
}
